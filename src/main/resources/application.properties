# Servidor
server.port=8080
spring.application.name=oficioya

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficioya_security}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnly1234567890!}
app.jwt.issuer=oficioya
app.jwt.ttl-minutes=30

# Logging
logging.level.org.springframework.security=WARN
