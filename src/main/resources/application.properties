spring.application.name=oficioya

# Servidor
server.port=8080

# Base de datos en memoria (H2) para que mvn test funcione sin PostgreSQL local
spring.datasource.url=jdbc:h2:mem:oficioyadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (requerido por JwtService)
app.jwt.secret=esta_es_una_clave_secreta_super_segura_para_el_laboratorio_dosw_123456
app.jwt.issuer=oficioya
app.jwt.ttl-minutes=30

# Logging
logging.level.org.springframework.security=WARN