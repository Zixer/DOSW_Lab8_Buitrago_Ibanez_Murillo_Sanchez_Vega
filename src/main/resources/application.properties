spring.application.name=oficioya

# Servidor
server.port=8080

# Base de datos H2 para desarrollo/testing
spring.datasource.url=jdbc:h2:mem:oficioyadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# JWT (usar variable de entorno para no exponer secretos)
app.jwt.secret=${JWT_SECRET:clave_secreta_por_defecto_desarrollo_local_123456}
app.jwt.issuer=oficioya
app.jwt.ttl-minutes=30